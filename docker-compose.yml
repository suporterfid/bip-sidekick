# Bip Sidekick - Hermes-native orchestration
#
# Services are grouped with Compose profiles so the stack can still ship in stages:
#
#   core   -> vault-sync + google-mcp + hermes
#   openwa -> WhatsApp read-only triage
#
# Bring up with the Makefile: `make up-core`, then `make up-gate`, then `make up-openwa`.

name: bip-sidekick

networks:
  internal:
    driver: bridge

volumes:
  vault:            # Obsidian markdown, git-synced to your devices
  hermes_home:      # Hermes config, SOUL, cron, sessions, logs
  openwa_session:   # WhatsApp Web session data (treat as a secret)
  audit:            # append-only audit log mirror

services:
  # MEMORY
  vault-sync:
    profiles: ["core"]
    build: ./services/agent   # reuses a tiny alpine+git image; see Dockerfile
    container_name: bip-vault-sync
    command: ["/scripts/git-sync.sh"]
    environment:
      VAULT_GIT_REMOTE: ${VAULT_GIT_REMOTE}
      VAULT_GIT_BRANCH: ${VAULT_GIT_BRANCH:-main}
      GIT_SYNC_INTERVAL: ${GIT_SYNC_INTERVAL:-300}
    volumes:
      - vault:/vault
      - ./scripts:/scripts:ro
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    networks: [internal]

  # SENSES (read-only)
  google-mcp:
    profiles: ["core"]
    build: ./services/google-mcp
    container_name: bip-google-mcp
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      # Read-only scopes ONLY. See docs/SECURITY.md before widening these.
      GOOGLE_SCOPES: "https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/calendar.readonly"
      MCP_TRANSPORT: "http"
      MCP_PORT: "8081"
    expose: ["8081"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    user: "10001:10001"
    networks: [internal]

  openwa:
    profiles: ["openwa"]
    # Point this at your fork's image, or build from a local checkout / submodule.
    # build: ./services/openwa/OpenWA
    image: ghcr.io/suporterfid/openwa:latest
    container_name: bip-openwa
    environment:
      ENGINE_TYPE: "baileys"          # lighter than whatsapp-web.js (no Chromium)
      MCP_ENABLED: "true"
      MCP_READONLY: "true"            # triage only; no sends from the agent path
      API_KEY: ${OPENWA_API_KEY}
      WEBHOOK_URL: ""                 # not needed for read-only triage
      DATABASE_TYPE: "sqlite"
    volumes:
      - openwa_session:/app/session   # QR/session state; sensitive
    expose: ["3000"]
    restart: unless-stopped
    user: "10002:10002"
    networks: [internal]

  # BRAIN + TELEGRAM GATEWAY + CRON
  hermes:
    profiles: ["core"]
    build: ./services/hermes
    container_name: bip-hermes
    command: ["gateway", "run"]
    environment:
      HERMES_HOME: /opt/data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      BRIEF_CRON: ${BRIEF_CRON:-0 6 * * *}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - hermes_home:/opt/data
      - vault:/vault
      - audit:/audit
    depends_on: [google-mcp]
    restart: unless-stopped
    networks: [internal]
